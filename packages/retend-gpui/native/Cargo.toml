[package]
name = "retend-gpui-native"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
benchmarks = ["gpui/profiler", "gpui/bench-support"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
gpui = { package = "gpui-pre", version = "=0.3.4", default-features = false, features = ["font-kit"] }
gpui-base = "0.6.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.4" }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
core-graphics = "=0.24.0"
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.4", default-features = false, features = ["font-kit"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
futures = "0.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", default-features = false, features = ["font-kit", "wayland", "x11"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4", default-features = false, features = ["font-kit", "test-support"] }
proptest = "1"

[patch.crates-io]
gpui-pre = { git = "https://github.com/resuite/gpui-pre", rev = "4fb6612e8f0d31b5d9e1c730c8566cea67f706ef" }
gpui-pre-macos = { git = "https://github.com/resuite/gpui-pre", rev = "4fb6612e8f0d31b5d9e1c730c8566cea67f706ef" }
gpui-pre-apple = { git = "https://github.com/resuite/gpui-pre", rev = "4fb6612e8f0d31b5d9e1c730c8566cea67f706ef" }
gpui-pre-wgpu = { git = "https://github.com/resuite/gpui-pre", rev = "4fb6612e8f0d31b5d9e1c730c8566cea67f706ef" }
gpui-pre-windows = { git = "https://github.com/resuite/gpui-pre", rev = "4fb6612e8f0d31b5d9e1c730c8566cea67f706ef" }

[profile.release]
lto = true
strip = "symbols"
