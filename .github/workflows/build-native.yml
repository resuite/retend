name: Build Native Addon

on:
  # Publishing is manual for now, so artifact builds are opt-in rather than
  # tied to a release event. Re-add `release: types: [published]` when
  # publishing moves into CI.
  workflow_dispatch:

jobs:
  # Fast HLSL validation with Microsoft's compiler on Linux. Catches
  # shader errors in ~1 minute instead of a full Windows release build.
  # Uses a modern profile purely for validation; the Windows job still
  # compiles the final shaders with fxc.
  validate-shaders:
    name: validate-shaders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned fork revision
        run: |
          REV=$(sed -n 's/.*gpui-pre-windows = { git = "[^"]*", rev = "\([0-9a-f]\{40\}\)".*/\1/p' packages/retend-gpui/native/Cargo.toml | head -1)
          echo "Fork rev: $REV"
          test -n "$REV"
          git clone --quiet https://github.com/resuite/gpui-pre /tmp/gpui-pre
          git -C /tmp/gpui-pre checkout --quiet "$REV"
          echo "SHADER_DIR=/tmp/gpui-pre/crates/gpui-pre-windows/src" >> "$GITHUB_ENV"
      - name: Install DirectXShaderCompiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.9.2607 --repo microsoft/DirectXShaderCompiler --pattern 'linux_dxc_*.tar.gz' --dir /tmp
          tar -xzf /tmp/linux_dxc_*.tar.gz -C /tmp
          echo "DXC=$(echo /tmp/*/bin/dxc)" >> "$GITHUB_ENV"
      - name: Compile all HLSL entry points
        run: |
          "$DXC" --version
          fail=0
          check() {
            if ! "$DXC" -T "$1" -E "$2" -I "$SHADER_DIR" "$3" -Fo /dev/null; then
              echo "FAILED: $2 ($1)"
              fail=1
            fi
          }
          for m in quad quad_transformed shadow shadow_transformed path_rasterization path_sprite underline underline_transformed monochrome_sprite monochrome_sprite_transformed subpixel_sprite polychrome_sprite polychrome_sprite_transformed; do
            check vs_6_0 "${m}_vertex" "$SHADER_DIR/shaders.hlsl"
            check ps_6_0 "${m}_fragment" "$SHADER_DIR/shaders.hlsl"
          done
          check vs_6_0 emoji_rasterization_vertex "$SHADER_DIR/color_text_raster.hlsl"
          check ps_6_0 emoji_rasterization_fragment "$SHADER_DIR/color_text_raster.hlsl"
          exit $fail

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Linux remains experimental; Windows native builds must be green.
    continue-on-error: ${{ startsWith(matrix.target, 'linux') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64-msvc
            runner: windows-2022
          - target: win32-arm64-msvc
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/retend-gpui/native
      - name: Install Linux system dependencies
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libclang-dev \
            libssl-dev zlib1g-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig1-dev libfreetype6-dev

      # `--ignore-scripts`: the repo-root `wrangler` devDependency pulls in
      # `workerd`, whose postinstall throws `Unsupported platform` on
      # Windows ARM and fails the whole install before cargo ever runs. The
      # native build needs no postinstall artifacts (napi CLI is a plain
      # bin, Rust comes from the toolchain action), so scripts are skipped.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build release addon
        run: pnpm --dir packages/retend-gpui run native:build:release -- --target=${{ matrix.target }} --locked
      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: retend-gpui-native-${{ matrix.target }}
          path: packages/retend-gpui/native/npm/${{ matrix.target }}/retend-gpui-native.${{ matrix.target }}.node
          if-no-files-found: error
      - name: Build JavaScript packages
        if: matrix.target == 'win32-x64-msvc'
        run: |
          pnpm run build-core
          pnpm run build-gpui
      - name: Package GPUI smoke app
        if: matrix.target == 'win32-x64-msvc'
        run: pnpm --dir packages/retend-gpui exec vite build --config tests/fixtures/windows-smoke/vite.config.ts
      - name: Verify packaged icon and metadata
        if: matrix.target == 'win32-x64-msvc'
        run: node packages/retend-gpui/tests/fixtures/windows-smoke/verify-package.mjs
      - name: Launch packaged app
        if: matrix.target == 'win32-x64-msvc'
        timeout-minutes: 2
        shell: pwsh
        env:
          RETEND_GPUI_SMOKE_MARKER: ${{ runner.temp }}\gpui-smoke.txt
        run: |
          $exe = (Resolve-Path 'packages/retend-gpui/tests/fixtures/windows-smoke/dist/win32-x64/GpuiSmoke.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'gpui-smoke-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'gpui-smoke-stderr.txt'
          $app = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($app.ExitCode -ne 0) { throw "Packaged app exited with $($app.ExitCode)" }
          if (!(Test-Path $env:RETEND_GPUI_SMOKE_MARKER)) { throw 'GPUI window did not render' }
          if ((Get-Content $env:RETEND_GPUI_SMOKE_MARKER -Raw) -ne 'mounted') { throw 'Unexpected smoke marker' }
