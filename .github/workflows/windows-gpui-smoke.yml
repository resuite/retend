name: Windows GPUI smoke

on:
  pull_request:
    paths:
      - '.github/workflows/build-native.yml'
      - '.github/workflows/windows-gpui-smoke.yml'
      - 'packages/retend-gpui/**'
      - 'packages/retend/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  windows-gpui-smoke:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/retend-gpui/native
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows native addon
        run: pnpm --dir packages/retend-gpui run native:build:release -- --target=win32-x64-msvc --locked
      - name: Build JavaScript packages
        run: |
          pnpm run build-core
          pnpm run build-gpui
      - name: Package GPUI smoke app
        run: pnpm --dir packages/retend-gpui exec vite build --config tests/fixtures/windows-smoke/vite.config.ts
      - name: Launch packaged app
        timeout-minutes: 2
        shell: pwsh
        env:
          RETEND_GPUI_SMOKE_MARKER: ${{ runner.temp }}\gpui-smoke.txt
        run: |
          $exe = 'packages/retend-gpui/tests/fixtures/windows-smoke/dist/win32-x64/GpuiSmoke.exe'
          $app = Start-Process -FilePath $exe -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Packaged app exited with $($app.ExitCode)" }
          if (!(Test-Path $env:RETEND_GPUI_SMOKE_MARKER)) { throw 'GPUI window did not render' }
          if ((Get-Content $env:RETEND_GPUI_SMOKE_MARKER -Raw) -ne 'mounted') { throw 'Unexpected smoke marker' }
