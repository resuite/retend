[package]
name = "retend-gpui-native"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
gpui = { git = "https://github.com/remorses/zed", rev = "8b94defe56992b3ca4ffd4853ace741d8168111a", default-features = false, features = ["font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
core-graphics = "=0.24.0"
gpui_macos = { git = "https://github.com/remorses/zed", rev = "8b94defe56992b3ca4ffd4853ace741d8168111a", default-features = false, features = ["font-kit"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
futures = "0.3"
gpui_platform = { git = "https://github.com/remorses/zed", rev = "8b94defe56992b3ca4ffd4853ace741d8168111a", default-features = false, features = ["font-kit", "wayland", "x11"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
gpui = { git = "https://github.com/remorses/zed", rev = "8b94defe56992b3ca4ffd4853ace741d8168111a", default-features = false, features = ["font-kit", "test-support"] }
proptest = "1"

[profile.release]
lto = true
strip = "symbols"
